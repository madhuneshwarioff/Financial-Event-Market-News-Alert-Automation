# Lint configuration. Line length is set to 100 to match the codebase.
line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are allowed in docstrings and URLs
    "B008",  # not relevant here
]

[lint.per-file-ignores]
"tests/*" = ["E402"]  # conftest adjusts sys.path before importing src
